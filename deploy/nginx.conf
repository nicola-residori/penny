# Only the dedicated reverse proxy may declare an external HTTPS connection.
# Direct HTTP clients cannot change the backend scheme with a forged header.
map "$remote_addr|$http_x_forwarded_proto" $penny_forwarded_proto {
    default $scheme;
    "192.168.1.6|https" https;
}

# Revalidate the SPA entry point, including client-side routes served by fallback.
# Hashed assets keep their normal caching behavior; API responses are unaffected.
map $sent_http_content_type $penny_html_cache_control {
    default "";
    ~^text/html "no-store";
}

server {
    listen 80;
    server_name _;
    client_max_body_size 6m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $penny_html_cache_control always;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $penny_forwarded_proto;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
