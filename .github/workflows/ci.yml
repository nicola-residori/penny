name: Penny CI
on:
  push:
    branches: [main, 'feature/**', 'codex/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    name: Backend - Java 21
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: penny_test
          POSTGRES_USER: penny_test
          POSTGRES_PASSWORD: test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U penny_test -d penny_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 4
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 0
      PENNY_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/penny_test
      PENNY_TEST_DB_USER: penny_test
      PENNY_TEST_DB_PASSWORD: test_only
      PENNY_BOOTSTRAP_EMAIL: bootstrap@test.invalid
      PENNY_BOOTSTRAP_PASSWORD: bootstrap_test_only_123
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test and package
        run: mvn -B -ntp verify
  frontend:
    name: Frontend - Node 22
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for committed environment secrets
        shell: bash
        run: |
          if git ls-files | grep -Eq '(^|/)\.env$'; then
            echo 'ERRORE: file .env versionato'; exit 1
          fi
          if git ls-files | grep -Eq '(^|/)(node_modules|target|dist)/'; then
            echo 'ERRORE: build artifacts versionati'; exit 1
          fi
          echo 'Repository hygiene OK'
