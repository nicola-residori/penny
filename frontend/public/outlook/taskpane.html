<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Salva in Penny</title><link rel="stylesheet" href="./outlook.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script><script type="module" src="./taskpane.js"></script></head><body><main><header><img src="/penny-icon.png" width="38" height="38" alt=""><div><h1>Salva in Penny</h1><p>La mail, nella scheda giusta.</p></div></header><button id="connect">Collega Penny</button><p id="status" role="status" aria-live="polite">Apri una mail per iniziare.</p><p id="error" role="alert"></p><section id="save-panel" hidden><label>Messaggi da salvare<select id="mode"><option value="current">Messaggio aperto</option><option value="selected" hidden>Messaggi selezionati in Outlook</option></select></label><button id="prepare" class="secondary">Prepara salvataggio</button><p id="summary"></p><label>Cerca cliente<input id="query" type="search" maxlength="100" placeholder="Nome cliente o prospect"></label><label>Cliente o prospect<select id="customer"><option value="">Scegli il cliente</option></select></label><p id="match-note"></p><button id="save" disabled>Salva in Penny</button><p id="result" role="status"></p><a id="open-crm" href="/" target="_blank" rel="noreferrer" hidden>Apri Penny</a><button id="disconnect" class="secondary">Disconnetti</button></section><footer>Solo i messaggi che scegli. Nessuna sincronizzazione automatica.</footer></main></body></html>
