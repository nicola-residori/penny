name: penny
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30
    logging: *logging
  backend:
    image: penny-backend:${PENNY_RELEASE:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      PENNY_BOOTSTRAP_EMAIL: ${PENNY_BOOTSTRAP_EMAIL:-}
      PENNY_BOOTSTRAP_PASSWORD: ${PENNY_BOOTSTRAP_PASSWORD:-}
    mem_limit: 1400m
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/actuator/health]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
    logging: *logging
  frontend:
    image: penny-frontend:${PENNY_FRONTEND_RELEASE:-${PENNY_RELEASE:-local}}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - '${PENNY_HTTP_BIND:-0.0.0.0}:${PENNY_HTTP_PORT:-80}:80'
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1/]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging
volumes:
  postgres_data:
