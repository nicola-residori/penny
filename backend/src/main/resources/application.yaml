spring:
  session:
    timeout: 30d
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  application:
    name: penny
  jackson:
    deserialization:
      accept-float-as-int: false
      use-big-decimal-for-floats: true
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
server:
  servlet:
    session:
      timeout: 30d
      cookie:
        name: PENNY_SESSION
        max-age: 30d
        http-only: true
        same-site: lax
management:
  endpoints:
    web:
      exposure:
        include: health,info
