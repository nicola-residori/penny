services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:5432:5432"
  backend:
    image: maven:3.9-eclipse-temurin-21
    working_dir: /workspace
    command: sh -c "mvn spring-boot:run"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      PENNY_BOOTSTRAP_EMAIL: ${PENNY_BOOTSTRAP_EMAIL}
      PENNY_BOOTSTRAP_PASSWORD: ${PENNY_BOOTSTRAP_PASSWORD}
    volumes:
      - ./backend:/workspace
      - maven_cache:/root/.m2
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
  frontend:
    image: node:22-alpine
    working_dir: /workspace
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/workspace
      - frontend_modules:/workspace/node_modules
    ports:
      - "${PENNY_FRONTEND_BIND:-0.0.0.0}:5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data:
  maven_cache:
  frontend_modules:
